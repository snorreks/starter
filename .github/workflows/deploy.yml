# Deploy.
#
# Manual only, on purpose. An unconfigured template must not publish itself when
# a commit lands, and "the checks passed" and "this was published" are different
# decisions with different authority — so CI never deploys, and this file is the
# only path that does.
#
# Everything about the shape here comes from one property:
#
#   **`concurrency` is keyed on the destination environment, and
#   `cancel-in-progress` is false.**
#
# Two applies to the same environment must never overlap. Overlapping them means
# two builds racing to migrate one D1 database and then two deploys racing to
# publish, and the loser wins silently. GitHub's *workflow-level* concurrency in
# `ci.yml` is keyed on the ref and cancels in progress, which is right for tests
# and wrong here: cancelling a run that is halfway through `d1 migrations apply`
# leaves a schema that is ahead of the code running on it, with no record that
# anything was in flight. So this is a **job-level** concurrency on the apply job
# only — the plan and preflight jobs still cancel freely, because neither mutates.
#
# There is no lock file. A lock in this checkout serialises one developer's
# machines and nothing else; two CI runs, or a CI run and an operator laptop, would
# both take it and both proceed. The environment concurrency group is the only
# serialisation here that is actually global.
#
# Credentials: one API token per environment, stored as a GitHub *environment*
# secret, so a fork's pull request can never reach it (this workflow does not
# trigger on `pull_request` at all) and staging's token is not readable while
# selecting production. Cloudflare's scoped API tokens are the least-privilege
# mechanism available here; an OAuth login would not exist on a runner.
#
# The operator escape hatch — running `wrangler deploy` by hand — is documented in
# docs/deployment.md as being *outside* this guarantee. It is a deliberate way to
# publish without the queue, not a second supported path.

name: Deploy

on:
  # `workflow_dispatch` only. A push to main does not deploy: this is an
  # unconfigured template, and the first deploy is an act with a resource bill.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy. Production is protected by an environment approval.'
        required: true
        type: choice
        options:
          - staging
          - production
      migrate:
        description: 'Apply reviewed migrations before deploying.'
        required: true
        default: true
        type: boolean
      first_deploy:
        description: 'Allow a first deploy, where the Worker does not exist yet.'
        required: false
        default: false
        type: boolean

# The floor. The token arrives as an environment secret rather than from this
# block, and nothing here needs to write to the repository.
permissions:
  contents: read

env:
  BUN_VERSION: '1.4.2'

jobs:
  # ── plan: offline ──────────────────────────────────────────────────────────
  #
  # No `environment:` and therefore no secrets. This is the job a reviewer can
  # read: it proves what *would* happen without needing authority to do it.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@7b8f5b94c955a854e6f8b8dc76b2b8c6bca29f45 # v2.2.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # `deploy:check` is the same planner the CLI uses and needs no credential.
      # If it fails here, the operator learns before the apply job is queued
      # rather than after it has claimed the concurrency group.
      - name: Plan
        run: bun run deploy:check --env ${{ inputs.environment }}

      - name: Guards
        run: bun run guard

      - name: Build the artifact
        run: bun run build && bun run check:bundle

  # ── apply: the only mutating job ───────────────────────────────────────────
  #
  # `environment:` gives this job the environment's secrets *and* the environment's
  # protection rules, which is how "production needs an approval" is expressed
  # without any logic in this file. It is also what makes `concurrency.group`
  # globally serialising: the group name is resolved from the same input.
  apply:
    name: Apply (${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-latest
    # Long enough for a real migration and a real deploy, short enough that a hang
    # does not hold the queue for a day. This bound is the *only* thing stopping a
    # stuck run from blocking every later apply to this environment.
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    # Keyed on the destination, not the ref. Two dispatches to staging queue behind
    # each other; a staging apply and a production apply do not block each other,
    # because they touch different Workers and different databases.
    #
    # `cancel-in-progress: false` is the load-bearing line. True would kill a run
    # mid-migration.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@7b8f5b94c955a854e6f8b8dc76b2b8c6bca29f45 # v2.2.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # In the environment, never in a step. A token in `${{ secrets.* }}` that is
      # also echoed would land in the run log; this assignment never prints.
      - name: Credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on the ${{ inputs.environment }} environment."
            exit 3
          fi
          # Confirm the token resolves to the account this project is configured
          # for, before the migration job has a chance to touch it.
          bun run deploy:preflight --env ${{ inputs.environment }} \
            ${{ inputs.first_deploy && '--allow-new-worker' || '' }}

      # The source SHA is recorded rather than re-derived later, so the release
      # record names the commit this run actually built rather than whatever HEAD
      # was when the record was written.
      - name: Record the source revision
        run: echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build && bun run check:bundle

      # One command for build, migrate, deploy, verify and record, in that order,
      # with `--yes` supplied here and nowhere else. The same pipeline the local
      # CLI runs: there is no CI-only deployment path to keep in step.
      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run deploy:apply --env ${{ inputs.environment }} --yes \
            ${{ !inputs.migrate && '--skip-migrations' || '' }}

      # The release record is the artifact of this workflow. Uploading it as a job
      # summary makes the provenance readable from the run page without anyone
      # having a Cloudflare login open.
      - name: Summarise the release
        if: always()
        run: bun run deploy:status --env ${{ inputs.environment }}