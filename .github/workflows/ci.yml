# Continuous integration.
#
# Five lanes, ordered by what they can catch and what they cost, and one gate that
# is the only thing a branch protection rule needs to name:
#
#   static   typecheck, lint, format, guards, workflow policy, Pi loader. Seconds.
#   unit     every project's unit lane, plus the real-browser lane. Needs Chromium.
#   worker   the built Worker in real workerd against real local D1.
#   compute  the built jobs Worker against real Workflows, real D1/R2 and real FFmpeg.
#            Needs Docker, builds the processor image, and is the slowest lane.
#   e2e      the built client and the built Worker, one origin, in a browser.
#   gate     needs all five. No code, no checkout, no credential.
#
# Properties this file exists to hold, each of which it previously lost:
#
#   1. **Every lane runs something that can fail, and proves it discovered work.**
#      `e2e:test` used to resolve to an `echo`: it installed Chromium, applied
#      migrations, printed a message and went green while the 20 Playwright specs
#      never ran. Each lane below asserts a nonzero count from the runner's own
#      output, so a runner that matches nothing fails the job instead of passing
#      it.
#
#   2. **Browser prerequisites are installed before the lane that needs them.**
#      Installing afterwards fails with "Executable doesn't exist" and reads as a
#      broken test rather than as a broken ordering.
#
#   3. **Nothing here needs a credential.** A check that cannot run without a token
#      is a check nobody runs. `pull_request` from a fork gets no secret even if
#      one existed, and none is referenced, so this stays true by construction.
#
#   4. **Untrusted code is never privileged.** For a `pull_request` from a fork,
#      `GITHUB_TOKEN` is read-only and no job runs on a self-hosted runner, a
#      pull-request target, or any event that grants write. The deploy path is a
#      separate workflow on a separate event, so "the checks passed" and "this was
#      published" are different decisions with different authority.
#
#   5. **Actions are pinned to commit SHAs.** A tag is a mutable pointer, and a
#      mutable pointer is an unaudited change to the thing that runs your code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer verify a template change without pushing a commit nobody
  # wants.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The floor, not the whole story. No job below needs more, and `pull_request` from
# a fork cannot be granted more than this regardless of what a workflow asks for.
# Read-only is enough because nothing here commits, pushes, or releases.
permissions:
  contents: read

env:
  # Pin these. A floating toolchain turns a green build red on a Tuesday for
  # reasons that have nothing to do with the change under review. `.bun-version`
  # holds the same value and the `version-mirrors` guard keeps them in agreement;
  # GitHub Actions cannot read a file into `env:` at the workflow level.
  BUN_VERSION: '1.4.2'

  # Every lane's "this many tests passed" check, in one place.
  #
  # The pattern is deliberately *not* anchored to the start of the line. Moon
  # prefixes every line it forwards with `<project>:<task> | `, so a runner's own
  # summary arrives as:
  #
  #   client:test-worker |  19 pass
  #   client:test-browser |       Tests  15 passed (15)
  #
  # An anchored `^[0-9]+ pass` matched none of them, and this job failed on a lane
  # that had passed 19 of 19 — the assertion doing exactly its job by refusing to
  # certify a count it could not read. `[1-9]` rather than `[0-9]` so a lane that
  # printed "0 passed" is still a failure.
  #
  # Two projects — ui and auth — have no test file of their own, so they print no
  # count at all and the lane's count has to be an aggregate. `@starter/database`
  # used to be the third: it declared `bun test --pass-with-no-tests` while
  # containing a rate-limiter test, which is a licence for the next test file to be
  # deleted unnoticed. The flag is gone now that the project has tests, and a
  # per-project assertion is still not the right shape — it would need a second
  # exemption list, and nothing verifies that list against the manifests.
  TESTS_PASSED_PATTERN: '(^|[[:space:]])[1-9][0-9]* (pass|passed)'

# ── What is cached, and what is not ──────────────────────────────────────────
#
# Two caches, both narrow, both keyed on the things that would invalidate them.
#
#   `~/.bun/install/cache`    Bun's global download cache. Content-addressed by the
#                             registry's integrity hash, so a hit for the same
#                             lockfile is a hit for the same bytes. Keyed on
#                             `bun.lock`, the pinned Bun version and the runner OS: a
#                             Bun upgrade changes the installer, and an OS change
#                             changes what the optional packages link against.
#   `~/.cache/ms-playwright`  The Chromium the two browser lanes launch. Keyed on
#                             the manifest that pins `@playwright/test` *and* on
#                             `bun.lock`, because the first decides which browser
#                             build is wanted and the second decides which version
#                             is installed — a lockfile change can move the former
#                             without touching the latter.
#                             Deliberately **no restore-key**: a partial match would
#                             restore a Chromium from another Playwright version, and
#                             `browsers:install` would find a directory it does not
#                             recognise and report success. A miss costs one
#                             download; a wrong hit costs a confusing "executable
#                             doesn't exist" two steps later.
#
# Nothing else is cached. Not `node_modules` (a workspace install is not one
# directory), not `.moon/cache` (every project sets `options.cache: false` because
# Moon 2.5.5 cannot build a key equal to the files these commands read — see
# .moon/workspace.yml), and not the guard's output.
#
# And not the guard at all, for the reason that decided it: `bun run guard` parses
# the whole repository, so a cached result is only as fresh as a key that would have
# to include every tsconfig `paths` entry, every `exports` map and every alias. It is
# uncached, and it is cheap enough not to need caching. Measured on the development
# machine over the whole tree, all eight guards, three consecutive runs:
#
#   architecture        881 / 894 / 1020 ms
#   the other seven     56 / 65 / 68 ms in total
#   total               937 / 952 / 1081 ms
#
# Reproduce it with `bun run scripts/src/cli.ts guard --profile`, which prints the
# same table. The static lane that runs it also spends minutes on typecheck and lint.
#
# `--affected` is deliberately not used either, and for the same reason. It was not
# turned on because the roots this round adds bring dependency edges the affected
# graph has never seen; a skip that is wrong is invisible, because the lane goes
# green without having looked. Reconsider it once the roots exist and their edges
# are real.
#
# No credential, `.env`, SOPS file or deployment overlay is cached in any job. Those
# are read at run time by `bun run secrets:exec` and by the deploy plan, and a cache
# that survives a job is a place a secret outlives its scope.

jobs:
  static:
    name: Typecheck, lint, guards
    runs-on: ubuntu-latest
    # Bounded. This lane has no browser and no database; if it needs more than
    # this something is wrong with the lane, not with the timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Moon resolves the merge base against `origin/main` to decide what is
          # affected. `fetch-depth: 0` is what Moon's own warning asks for; without
          # it the merge base does not exist either.
          fetch-depth: 0
          # No step here commits or pushes, so the token has no reason to outlive
          # the checkout. Left in `.git/config` it is readable by anything that runs
          # repository code — which is every test in this file.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        # Every project, not just one. A shared package that stops typechecking
        # breaks its consumers in ways that read as their problem.
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        # Verified, not applied: a formatter that silently rewrites on CI hides
        # which commit introduced the drift.
        run: bun run format

      - name: Guards
        # All eight, uncached, over the whole repository. Not `--affected`, and not a
        # cache hit: see the note at the top of this file for why a wrong skip is
        # worse than a second of parsing.
        run: bun run guard

      - name: Workflow policy
        # Parses `.github/workflows/*.yml` and asserts the properties the ones in
        # this repository depend on: a pinned `permissions`, a job timeout, and no
        # credential referenced by a workflow that also runs pull-request code.
        run: bun run workflows

      - name: Evidence manifest
        # The capability matrix's current table is generated from
        # `docs/evidence/current.json`. This fails the moment the two disagree, so a
        # count cannot drift away from the run that produced it without CI noticing —
        # which is the failure this file previously had and nobody caught.
        #
        # Read-only, no credential, no network, and uncached.
        run: bun run evidence

      - name: Pi extension loader smoke
        # Drives the real pinned Pi resource loader against this repository's `.pi/`
        # layout. A test file or helper left inside `.pi/extensions` is loaded as an
        # extension on every start and fails; nothing else in the suite notices,
        # because `bun test` passes on files Pi cannot load.
        run: bun run --cwd .pi loader:smoke

  unit:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Restore Playwright's browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # The manifest pinning `@playwright/test` decides which browser build is
          # wanted, and `bun.lock` decides which version is actually installed — a
          # lockfile change can move the former without touching the latter. Both are
          # in the key, or a cache hit could serve a browser the lockfile no longer
          # asks for. No restore-key on purpose; see the caching note at the top of
          # this file.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json', 'bun.lock') }}

      - name: Install Playwright's Chromium
        # After the restore, and before the browser lane.
        #
        # Order matters and the wrong order is invisible: a restore *after* the
        # download leaves the browser the install already fetched, so the cache step
        # costs time and saves nothing. `browsers:install` is still the authority —
        # it is the step that installs what is missing and is a no-op on a hit — so
        # this is a fast path, not a replacement.
        #
        # Through the workspace script, not `bunx`: `bunx playwright` from the
        # repository root does not resolve the pinned copy and installs whatever
        # version the registry serves, which does not match the `@playwright/test`
        # these lanes run against.
        run: bun run --cwd apps/e2e browsers:install

      - name: Unit tests
        # `moon run :test` fans out to each project's own `test` script, so a new
        # package is covered by adding a script rather than by editing this file.
        run: set -o pipefail; bun run test 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Assert the unit lane discovered and passed tests
        # Three projects declare `bun test --pass-with-no-tests`, so a green run can
        # legitimately contain no tests. The lane as a whole may not: if none of
        # them discovered anything, the runner matched nothing and the job is a
        # green no-op.
        run: |
          if ! grep -qE "$TESTS_PASSED_PATTERN" "$RUNNER_TEMP/unit.log"; then
            echo "::error::The unit lane reported no passing tests. See the log above."
            exit 1
          fi

      - name: Browser tests
        run: set -o pipefail; bun run test:browser 2>&1 | tee "$RUNNER_TEMP/browser.log"

      - name: Assert the browser lane discovered and passed tests
        # The lane whose configuration silently dropped its own browser selection.
        # It passes trivially when the runner discovers nothing, so the count is
        # asserted rather than inferred from the exit code.
        run: |
          if ! grep -qE "$TESTS_PASSED_PATTERN" "$RUNNER_TEMP/browser.log"; then
            echo "::error::The browser lane reported no passing tests. See the log above."
            exit 1
          fi

      - name: Prove the browser selection reaches the launched process
        # Deliberately not part of `bun run test`. It launches real Chromium
        # processes, and `moon run :test` runs every project's `test` task
        # concurrently — so inside the unit lane it competes for CPU with
        # `pi:test`, whose ownership tests spawn a child and then read
        # `/proc/<pid>/environ` after a fixed 150 ms. That race is one this branch
        # introduced; this lane is what removed it. Loosening a sleep in another
        # project's test would have hidden the coupling instead.
        run: |
          set -o pipefail
          bun run scripts/src/cli.ts cached -- scripts:test-browser-launch \
            2>&1 | tee "$RUNNER_TEMP/browser-launch.log"

      - name: Assert the browser-launch proof ran
        run: |
          if ! grep -qE "$TESTS_PASSED_PATTERN" "$RUNNER_TEMP/browser-launch.log"; then
            echo "::error::The browser-launch proof reported no passing tests. See the log above."
            exit 1
          fi

  worker:
    name: Worker integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Worker integration tests
        # Builds the Worker, then runs a real `wrangler dev` on the built
        # `.svelte-kit/cloudflare/_worker.js` against a real local D1, on a port it
        # allocates, with a run id so a leftover listener cannot be mistaken for
        # this run's server. `wrangler dev` shells out to Node, which the runner
        # image has.
        run: set -o pipefail; bun run test:worker 2>&1 | tee "$RUNNER_TEMP/worker.log"

      - name: Assert the Worker lane discovered and passed tests
        run: |
          if ! grep -qE "$TESTS_PASSED_PATTERN" "$RUNNER_TEMP/worker.log"; then
            echo "::error::The Worker lane reported no passing tests. See the log above."
            exit 1
          fi

  compute:
    name: Compute integration
    runs-on: ubuntu-latest
    # The longest lane by a wide margin: it builds a 540 MB image (a Rust release
    # build plus Debian's FFmpeg) before it can run anything. Thirty minutes is
    # generous for the encode itself and is here for the image.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      # No image cache. The lane is about whether a *fresh* checkout can build and
      # run the processor; a restored layer would make that a claim about whoever
      # filled the cache last, and a Dockerfile change does not reliably invalidate
      # every layer it should.
      - name: Compute integration tests
        # Starts the real FFmpeg image with Docker, then drives the built jobs Worker
        # in the local Workers runtime against real local D1 and R2. Docker is present
        # on the runner image; the lane refuses with a named prerequisite if it is not.
        run: set -o pipefail; bun run test:compute 2>&1 | tee "$RUNNER_TEMP/compute.log"

      - name: Assert the compute lane discovered and passed tests
        run: |
          if ! grep -qE "$TESTS_PASSED_PATTERN" "$RUNNER_TEMP/compute.log"; then
            echo "::error::The compute lane reported no passing tests. See the log above."
            exit 1
          fi

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply migrations to local D1
        # Without this every route fails on a missing table, and the failure reads
        # as a product bug rather than as a missing step.
        run: bun run db:migrate

      - name: Restore Playwright's browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json', 'bun.lock') }}

      - name: Install Playwright's Chromium
        # After the restore, for the reason given in the unit job: a restore after
        # the download is a cache step that helps nobody.
        run: bun run --cwd apps/e2e browsers:install

      - name: End-to-end tests
        # `e2e:e2e` is the real Playwright suite. It builds the app, starts the
        # BUILT Worker in workerd on one origin, proves that origin is this run's
        # Worker via a run id, and drives a browser against it.
        #
        # One `webServer` entry, not two. The page, the assets and `/api/*` are all
        # served by that one process, so there is no proxy for the browser to cross
        # and no second server whose readiness could be mistaken for the first.
        #
        # Output is teed so the next step can assert on it, and `pipefail` keeps a
        # Playwright failure from being swallowed by the pipeline's last exit code.
        run: set -o pipefail; bun run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Assert the E2E suite discovered and passed tests
        # A renamed or moved spec directory makes Playwright report zero tests and
        # exit 0. That is a green job that ran nothing — the same shape of problem
        # as the `echo` this job used to run.
        run: |
          if ! grep -qE "$TESTS_PASSED_PATTERN" "$RUNNER_TEMP/e2e.log"; then
            echo "::error::The E2E run reported no passing tests. See the log above."
            exit 1
          fi

      - name: Upload failure artifacts
        # Traces and screenshots only when something failed. Uploading them
        # unconditionally would put unreleased UI into artifact storage.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one check a branch rule names.
  #
  # `always()` so it reports a skipped or cancelled lane as a failure rather than
  # as success: with `if: success()` on the dependents, a lane that never started
  # — because a runner was unavailable, or because a `needs` edge was mistyped —
  # leaves this job with nothing to wait for and it passes. `!cancelled()` keeps a
  # cancelled run cancelled, which is not a pass and not a fail.
  #
  # `permissions: {}` because this job reads no repository content: it decides
  # from the four `needs` results.
  gate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, unit, worker, compute, e2e]
    if: always() && !cancelled()
    permissions: {}
    steps:
      - name: Require every lane
        # The four results arrive through `env:`, not through `${{ }}` inside the
        # script. Interpolating an expression directly into a `run:` body is how a
        # value becomes shell source: anything a job name or result could contain
        # would be parsed by bash, not treated as data. GitHub's own hardening guide
        # recommends passing expression values through the environment for exactly
        # this reason.
        #
        # Each result is a separate variable so a failure names the lane, rather
        # than reporting one boolean built from four interpolations.
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          COMPUTE_RESULT: ${{ needs.compute.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          status=0
          # Iterate the variable names, not the lane names: `${!var}` is an indirect
          # expansion, so the loop needs no `eval` and no index arithmetic. No `eval`
          # is the point — it would re-introduce the "value parsed as source" problem
          # the env block exists to remove.
          for var in STATIC_RESULT UNIT_RESULT WORKER_RESULT COMPUTE_RESULT E2E_RESULT; do
            result="${!var}"
            lane="$(printf '%s' "$var" | tr '[:upper:]' '[:lower:]')"
            lane="${lane%_result}"
            case "$result" in
              success) echo "ok    $lane" ;;
              *)
                echo "::error::lane $lane reported '$result'"
                status=1
                ;;
            esac
          done
          exit "$status"