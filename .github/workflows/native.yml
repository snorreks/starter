# The native desktop lane.
#
# Two jobs, and the split between them is the point:
#
#   rust      format, clippy and the crate's unit test on one platform, because
#             none of the three is platform-specific and all three are cheap.
#   desktop   a real `tauri build` on Linux, macOS and Windows, with the binary
#             uploaded as an artifact named by target and revision.
#
# What is deliberately absent, each of which is a different capability and not a
# smaller version of this one:
#
#   * **Signing and notarization.** A Windows certificate, an Apple Developer ID
#     and notarization credentials are inputs a fork's pull request cannot supply,
#     and a workflow that referenced them would fail for every contributor. The
#     build job therefore produces an *unsigned* binary and says so in the
#     artifact name; a release lane with real credentials is added by whoever owns
#     releases.
#   * **An installer.** `--no-bundle` skips AppImage, DMG and MSI, which need
#     downloaders and packagers of their own. The unit under test is the shell and
#     the frontend it embeds.
#   * **A launched application.** See `docs/native.md`: launching needs a display,
#     a webview and a session, and "the binary exists" is not "the app runs". CI
#     records the first honestly rather than implying the second.
#
# Nothing here needs a credential, and `pull_request` from a fork gets none.
#
# The Rust toolchain is not installed by an action: the runners already carry
# `rustup`, and `rustup` honours `apps/frontend/native/src-tauri/rust-toolchain.toml`
# the moment `cargo` is invoked there — which is why the channel in that file is a
# number rather than "stable".

name: Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.2'
  # The Rust channel is declared by `src-tauri/rust-toolchain.toml`; this is only a
  # human-readable label for the job summary and for the artifact names.
  RUST_TOOLCHAIN_LABEL: '1.98.1'
  # The API origin a packaged build is compiled against. There is no deployment in
  # this repository, so this is a reserved name that can never resolve — which is
  # the point: a build that somehow shipped a real origin would show it here.
  VITE_NATIVE_API_ORIGIN: 'https://api.starter.invalid'

jobs:
  rust:
    name: Rust fmt, clippy and unit tests
    runs-on: ubuntu-latest
    # A compile of the shell's dependencies is the slowest thing here, and it is
    # bounded rather than open-ended so a wedged build fails with a name.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        # `rustup` reads `rust-toolchain.toml` from the crate directory, so this both
        # installs the channel the crate pins and fails loudly if the file is missing.
        run: rustup show active-toolchain || rustup toolchain install

      # Before every cargo step below, in this job as well as in `desktop`. Without
      # it `cargo test` dies inside `glib-sys`'s build script, on the job whose
      # entire subject is this crate's own Rust — naming a crate rather than the
      # package that provides it, which is the failure this action prevents.
      - uses: ./.github/actions/install-native-linux-deps

      - name: Format
        # `cargo fmt --check`, never a write: a formatter that rewrites on CI hides
        # which commit introduced the drift.
        working-directory: apps/frontend/native/src-tauri
        run: cargo fmt --check

      - name: Clippy
        # Warnings denied, over every target, so a test-only helper is linted too.
        working-directory: apps/frontend/native/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        # There is a real test in this crate (the vault key derivation), so this
        # cannot be a zero-test pass. The count is asserted rather than assumed.
        working-directory: apps/frontend/native/src-tauri
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
          if ! grep -qE '(^|[[:space:]])[1-9][0-9]* (passed|passed;)' "$RUNNER_TEMP/rust-test.log"; then
            echo "::error::The Rust lane reported no passing tests. See the log above."
            exit 1
          fi

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One in flight at a time per platform: three native builds at once is a
      # three-times-longer queue behind a shared Cargo download cache, and a cancelled
      # half-finished build teaches nothing.
      max-parallel: 1
      fail-fast: false
      matrix:
        # The three desktop platforms a real user installs this on. A Linux `.deb`
        # build would be an extra packager; the binary is the unit under test here.
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      # The webview libraries Tauri links against. Ubuntu's runner image does not
      # carry them, and the failure otherwise arrives from `webkit2gtk-sys`'s build
      # script naming a crate instead of a package. One definition, shared with
      # the `rust` job: see the action's own comment for why it is not copied.
      - name: Install Linux webview libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-native-linux-deps

      - name: Report what this host can build
        # The same command a contributor runs, and it must pass: a doctor that fails
        # here means the build below would fail with a worse message.
        run: bun run native:doctor

      - name: Build the static frontend
        # Run directly rather than through `bun run native:build` so the doctor has
        # already proved the capability, and so this step's output is the frontend
        # alone: if the frontend is broken, the failure names the frontend.
        run: bun run --cwd apps/frontend/native build

      - name: Prove the frontend carries no server code
        # The control that keeps the two application bundles from converging. It runs
        # here, before the shell is built, because a leak found here is a review of
        # one JavaScript file rather than of an installer.
        run: bun run --cwd apps/frontend/native check:bundle

      - name: Build the desktop binary
        # `--no-bundle` is the honest scope for this lane: a signed installer needs
        # credentials this workflow deliberately does not have. The binary is the
        # thing that proves the shell compiles and links against the frontend above.
        #
        # No `--platform`: each runner *is* its platform, and naming it would only
        # ask this command to resolve a name to the triple it is already on. What it
        # does is refuse a platform the host is not — so this step passing is a
        # statement that the matrix entry and the runner agree.
        run: bun run native:build -- --no-bundle

      - name: Locate the built binary
        id: artifact
        # Paths differ per platform, so they are searched rather than hardcoded; a
        # missing binary is then an error from this step rather than an empty upload.
        shell: bash
        run: |
          set -euo pipefail
          found="$(find apps/frontend/native/src-tauri/target/release -maxdepth 1 -type f \
            \( -name 'starter' -o -name 'starter.exe' \) | head -n 1 || true)"
          if [ -z "$found" ]; then
            echo "::error::no built binary under src-tauri/target/release"
            ls -la apps/frontend/native/src-tauri/target/release || true
            exit 1
          fi
          cp "$found" "$RUNNER_TEMP/starter-unsigned"
          # One digest, two commands. macOS ships `shasum` and has never shipped
          # `sha256sum`, so the obvious spelling fails on exactly the runner whose
          # build it was meant to certify — after the binary was built and copied,
          # which is the most expensive place to discover it.
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$found" | cut -d' ' -f1)"
          else
            digest="$(shasum -a 256 "$found" | cut -d' ' -f1)"
          fi
          {
            echo "path=$RUNNER_TEMP/starter-unsigned"
            echo "sha=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "built $found"
          echo "sha256 $digest"

      - name: Upload the unsigned binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Target, revision and the word "unsigned" are in the name on purpose: an
          # artifact that cannot be mistaken for a release is not mistaken for one.
          name: starter-desktop-${{ runner.os }}-${{ github.sha }}-unsigned
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 7
          if-no-files-found: error
  # ── Android ────────────────────────────────────────────────────────────────
  #
  # A debug APK and a release AAB, from one checkout, plus a real emulator launch.
  #
  # Two build flavours because they are two different questions. The debug APK is
  # what a phone installs: the pinned CLI's own Gradle template sets
  # `manifestPlaceholders["usesCleartextTraffic"] = "true"` *only* in the debug
  # build type, which is how a development build reaches a plain-http dev server
  # while the release build cannot. The release AAB is what a store would take,
  # and it has the same frontend with cleartext off — so if the two produced the
  # same bytes, the debug exception had leaked.
  #
  # Nothing here is signed. A keystore is a credential a fork's pull request
  # cannot supply, and a workflow that referenced one would fail for every
  # contributor. Every artifact says `unsigned` in its name, which is the whole
  # point of the naming rule in `scripts/check_artifacts.ts`.

  android:
    name: Android debug APK + release AAB
    runs-on: ubuntu-22.04
    # Gradle downloads a build-tools and platform image, and a cold NDK compile of
    # four ABIs is slow. Bounded rather than open-ended so a wedged download
    # fails with a name.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-android-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-android-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Gradle compiles the Android module, so a JRE is not enough. 17 is what the
      # Android Gradle Plugin the pinned CLI ships supports; a newer JDK is not
      # automatically better here and an older one fails with a message about a
      # plugin nobody has heard of.
      - name: Install a JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK, NDK and emulator
        # Every package name here was read out of Google's own repository index
        # (`dl.google.com/android/repository/repository2-3.xml` and
        # `sys-img/google_apis/sys-img2-3.xml`), not guessed.
        #
        # `platforms;android-37` does **not** exist. Android publishes platform
        # packages under minor-versioned names — `android-37.0`, `37.1`, `37.2` —
        # and CI proved it: `sdkmanager` answered `Failed to find package
        # 'platforms;android-37'` and the lane died before building anything.
        # `37.2` is the newest 37.x on the **stable** channel; the `-beta`
        # variants are deliberately not used.
        #
        # `ndk;29.0.13846066` is `NDK_VERSION` in the pinned CLI's own source, and
        # `bun run native:doctor -- --platform android` in the next step is what
        # requires it — it would otherwise be missing and the build would refuse.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 13114758
          packages: >-
            platform-tools
            platforms;android-37.2
            ndk;29.0.13846066
            emulator
            system-images;android-34;google_apis;x86_64
          accept-android-sdk-licenses: true

      - name: Install the pinned toolchain and the mobile targets
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Report what this host can build
        # Must pass: a doctor that fails here means the build below fails with a
        # worse message.
        run: bun run native:doctor -- --platform android

      - name: Generate the Android project
        # `--ci` is not optional in CI: without it the CLI *prompts* for values on
        # a TTY that does not exist, and a build that depends on a prompt is a
        # build whose result depends on the runner.
        run: bun run native:android -- init --ci

      - name: Build the static frontend
        run: bun run --cwd apps/frontend/native build

      - name: Prove the frontend carries no server code
        run: bun run --cwd apps/frontend/native check:bundle

      - name: The launcher propagates a build failure
        # An induced failure, deliberately. The bad linker is an environment
        # variable, so nothing tracked is modified, and `CARGO_TARGET_DIR` points
        # at a fresh directory so cargo has to relink from source rather than
        # reusing an incremental artifact and never reaching the linker at all.
        # The point is that the wrapper returns *that* exit status rather than 0;
        # a launcher that reported success here would make every later step in
        # this job a lie.
        run: |
          set -uo pipefail
          if CARGO_TARGET_DIR="$RUNNER_TEMP/induced-target" \
             CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$RUNNER_TEMP/no-such-linker" \
             bun run native:android -- build --debug --apk --target aarch64 --ci \
             >"$RUNNER_TEMP/induced-failure.log" 2>&1; then
            echo "::error::an Android build with an unusable linker reported success"
            tail -n 40 "$RUNNER_TEMP/induced-failure.log"
            exit 1
          fi
          if ! grep -q "no-such-linker" "$RUNNER_TEMP/induced-failure.log"; then
            echo "::error::the build failed without reaching the linker, so this proved nothing"
            tail -n 40 "$RUNNER_TEMP/induced-failure.log"
            exit 1
          fi
          echo "induced failure propagated with a nonzero exit status, and reached the linker"

      - name: Build the debug APK
        # One ABI on purpose. A debug package is what a phone installs during
        # development, it is built four times slower with all four, and the
        # artifact name below claims the target it actually contains.
        run: bun run native:android -- build --debug --apk --target aarch64 --ci

      - name: Build the release AAB
        # No `--target` here, and that is deliberate: an .aab carrying a single ABI
        # is not a complete Play bundle. Gradle therefore groups the outputs under
        # `universal`/`universalRelease`, which is why nothing below hardcodes an
        # output path.
        run: bun run native:android -- build --aab --ci

      - name: Name the artifacts with the one naming authority
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          outputs=apps/frontend/native/src-tauri/gen/android/app/build/outputs
          apk="$(find "$outputs" -name '*.apk' -type f | head -n 1)"
          aab="$(find "$outputs" -name '*.aab' -type f | head -n 1)"
          # Named, not assumed. The previous version of this step guessed
          # `outputs/apk/debug` and `outputs/bundle/release`; Gradle actually wrote
          # `apk/universal/debug/` and `bundle/universalRelease/`, so both `find`s
          # came back empty and the verify step below was handed two paths that do
          # not exist.
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "::error::the Android build produced no .apk or no .aab under $outputs"
            find "$outputs" -maxdepth 3 -type d || true
            exit 1
          fi
          echo "found: $apk"
          echo "found: $aab"
          mkdir -p "$RUNNER_TEMP/dist"
          # The APK is `aarch64` because the step above said so. The AAB is
          # `universal` because it carries all four ABIs, and a name that said
          # otherwise would be a lie the checker could not detect.
          cp "$apk" "$RUNNER_TEMP/dist/$(bun run --cwd apps/frontend/native check:artifacts -- --name android aarch64 apk unsigned | tail -n 1)"
          cp "$aab" "$RUNNER_TEMP/dist/$(bun run --cwd apps/frontend/native check:artifacts -- --name android universal aab unsigned | tail -n 1)"
          # Only what the upload step below reads. An output nothing consumes is
          # a claim about the run that nobody checks.
          echo "dist=$RUNNER_TEMP/dist" >> "$GITHUB_OUTPUT"

      - name: Verify the artifacts name themselves and contain the expected origin
        # After the rename, and on the renamed files. Gradle names its own output
        # `app-universal-release.aab`, which says nothing about a target or a
        # revision; the name this repository ships is the one that has to carry
        # them, so that is the name that has to be checked. Running this first —
        # against paths that did not exist — is what it did before.
        run: |
          set -euo pipefail
          bun run --cwd apps/frontend/native check:artifacts -- \
            -- "${{ steps.artifact.outputs.dist }}" \
            --origin "$VITE_NATIVE_API_ORIGIN" \
            --revision "$GITHUB_SHA" --platform android

      - name: Upload the unsigned Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter-android-${{ github.sha }}-unsigned
          path: ${{ steps.artifact.outputs.dist }}
          retention-days: 7
          if-no-files-found: error

      - name: Boot an emulator
        # The launch is the part a browser viewport cannot stand in for: it is the
        # Android runtime's own window, its own back button and its own lifecycle.
        # `-no-window` still runs the real framework.
        #
        # Every wait is bounded, and the previous version of this step claimed to
        # be while `adb wait-for-device` sat in front of it with no bound at all:
        # a runner where the emulator never appears as a device blocks there
        # forever, holding the job until GitHub's own timeout. The comment now
        # matches the code.
        run: |
          set -euo pipefail
          # One AVD home, exported, for both `avdmanager` and the emulator.
          #
          # The emulator searches `$ANDROID_AVD_HOME`, then `$ANDROID_SDK_HOME/avd`,
          # then `$HOME/.android/avd` — and says so in its own error. Pinning it
          # removes the possibility of the two disagreeing about where an AVD lives,
          # which is exactly what happened: `avdmanager` wrote somewhere, the
          # emulator looked elsewhere, and the launcher answered
          # `ERROR | Unknown AVD name [starter-api34]`.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n starter-api34 -k 'system-images;android-34;google_apis;x86_64' --force
          # `avdmanager create` exited 0 having created nothing on the previous run —
          # it printed `Auto-selecting single ABI x86_64` and stopped, with no
          # `Created AVD` line, and the step carried on. So the creation is *checked*
          # rather than assumed, and the check is the one the emulator's own error
          # message recommends.
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'starter-api34'; then
            echo "::error::avdmanager exited 0 but created no AVD named starter-api34"
            echo "--- the emulator sees:"
            "$ANDROID_HOME/emulator/emulator" -list-avds || true
            echo "--- ANDROID_AVD_HOME=$ANDROID_AVD_HOME contains:"
            ls -la "$ANDROID_AVD_HOME" || true
            exit 1
          fi
          echo "created AVD: $("$ANDROID_HOME/emulator/emulator" -list-avds | grep -x 'starter-api34')"

          # Hardware acceleration, and the one thing on this runner that decides
          # whether an x86_64 emulator can run at all:
          #
          #     ERROR | x86_64 emulation currently requires hardware acceleration!
          #     ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm).
          #
          # `/dev/kvm` exists and is group-owned by `kvm`; the runner user is
          # simply not a member. Named here because it is a prerequisite of the
          # *host*, not of the project: a runner without nested virtualization
          # cannot boot this AVD however the workflow is written.
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner: an x86_64 emulator needs hardware"
            echo "  virtualization. Re-run on a hosted runner, or on a self-hosted one with nested"
            echo "  virtualization enabled. The AVD above is created and correct; there is simply"
            echo "  nothing to run it on."
            exit 1
          fi
          sudo groupadd -r kvm 2>/dev/null || true
          sudo usermod -aG kvm "$USER"
          sudo chown root:kvm /dev/kvm
          sudo chmod 0660 /dev/kvm
          echo "groups now: $(id -nG)"

          # `usermod -aG` does not affect processes that already exist, and this
          # step's shell is one of them — so joining the group and then launching
          # the emulator normally would leave it with the *old* supplementary
          # groups and the identical KVM error. `sg` starts a new session with the
          # group, which takes effect immediately.
          sg kvm -c "$ANDROID_HOME/emulator/emulator -avd starter-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -wipe-data" \
            >"$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "emulator pid $!"
          if ! timeout 120 adb wait-for-device; then
            echo "::error::no Android device appeared within 120s of starting the emulator"
            tail -n 40 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi
          # Bounded boot: an emulator that reports `boot_completed` late, or never,
          # must fail here rather than in the install step four minutes later. The
          # log goes with it, because "it never booted" and "it booted and
          # crashed" need different fixes.
          if ! timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            echo "::error::the emulator did not report sys.boot_completed within 420s"
            adb devices || true
            tail -n 40 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi
          # A booted emulator with no launcher is not usable, and the failure
          # otherwise arrives as an `adb install` timeout naming nothing.
          timeout 60 adb shell input keyevent KEYCODE_WAKEUP || true
          echo "the emulator is booted"

      - name: Install and launch on the emulator
        id: launch
        run: |
          set -euo pipefail
          apk="$(find "$RUNNER_TEMP/dist" -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::no .apk in $RUNNER_TEMP/dist"
            ls -la "$RUNNER_TEMP/dist"
            exit 1
          fi
          adb install -r "$apk"

          # **Ask Android which package and which activity**, rather than naming
          # them.
          #
          # This step hardcoded `com.example.starter/.MainActivity` and the APK
          # installed cleanly — then `am start` answered `Activity class
          # {com.example.starter/com.example.starter.MainActivity} does not
          # exist`. The reason is `bundle.android.debugApplicationIdSuffix:
          # ".debug"` in `tauri.conf.json`: the debug build installs as
          # `com.example.starter.debug`, precisely so it can sit beside a release
          # build on one phone. A hardcoded base id launches nothing at all, and
          # the error names a class that does exist — in the *other* package.
          package="$(adb shell pm list packages | tr -d '\r' | sed -n 's/^package:\(com\.example\.starter.*\)$/\1/p' | head -n 1)"
          if [ -z "$package" ]; then
            echo "::error::the APK installed but no com.example.starter* package is registered"
            adb shell pm list packages | tr -d '\r' | grep -i starter || true
            exit 1
          fi
          echo "installed as: $package"

          # `resolve-activity` is the platform's own answer, so the launcher
          # activity is whatever the manifest declares rather than a name typed
          # here. `-c LAUNCHER` is what picks the entry point out of several.
          activity="$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$package" | tr -d '\r' | tail -n 1)"
          case "$activity" in
            */*) echo "launcher activity: $activity" ;;
            *)
              echo "::error::Android reports no launcher activity for $package"
              echo "$activity"
              exit 1
              ;;
          esac

          adb shell am start -W -n "$activity"
          sleep 10
          # The activity is running: a launch that fails leaves no resumed window.
          if ! adb shell dumpsys activity activities | grep -q "$activity"; then
            echo "::error::the app was installed but $activity is not resumed"
            adb shell dumpsys activity activities | head -n 60
            adb logcat -d -s chromium:* AndroidRuntime:E | tail -n 60 || true
            exit 1
          fi
          echo "the app is installed and $activity is resumed on an Android ${ANDROID_API:-34} emulator"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "activity=$activity" >> "$GITHUB_OUTPUT"

      - name: The Android back button navigates the app and does not kill it
        run: |
          set -euo pipefail
          # Back on the root of a single-page app leaves the app; the property
          # under test is that it *does* rather than hanging, and that a second
          # press from a deep link returns to the previous screen instead.
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          # The package is the resolved one, for the same reason as above: the
          # debug build is `com.example.starter.debug`.
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          if ! adb shell pm list packages | tr -d '\r' | grep -q "^package:${{ steps.launch.outputs.package }}$"; then
            echo "::error::the app is no longer registered after two back presses"
            exit 1
          fi
          echo "KEYCODE_BACK delivered twice; ${{ steps.launch.outputs.package }} is still installed"

      - name: Record what this run did and did not prove
        run: |
          echo "### Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- debug APK and release AAB: **built**, unsigned." >> "$GITHUB_STEP_SUMMARY"
          echo "- installed and launched on an API ${ANDROID_API:-34} emulator: **yes**." >> "$GITHUB_STEP_SUMMARY"
          echo "- signed with a real keystore: **NOT RUN** — no keystore credential is reachable from an untrusted pull request. Use .github/workflows/native-release.yml." >> "$GITHUB_STEP_SUMMARY"
          echo "- Google Play upload: **NOT RUN**, deliberately. This repository does not publish to a store." >> "$GITHUB_STEP_SUMMARY"
          echo "- authenticated sign-in and the notes path: **NOT RUN** — no deployed API is configured in this template. The steps that need one are named in docs/native.md." >> "$GITHUB_STEP_SUMMARY"

  # ── iOS ────────────────────────────────────────────────────────────────────
  #
  # A simulator bundle, built and launched on macOS.
  #
  # macOS is not a preference. The pinned CLI compiles its `ios` subcommand only
  # into its macOS build, so `tauri ios build` on Linux is `unrecognized
  # subcommand` — a Linux runner cannot be credited with an iOS build however many
  # Rust targets it has installed. `bun run native:doctor -- --platform ios`
  # refuses on a non-macOS host for the same reason, with exit 3.
  #
  # `--target aarch64-sim` is stated rather than defaulted: the CLI's default is
  # `aarch64`, the *device*, and an IPA for the device cannot be installed on any
  # simulator. That mistake surfaces as a failed install several minutes later.

  ios:
    name: iOS simulator bundle
    # macos-15, not macos-14: the step below needs Xcode 16+, and macos-14's
    # `/Applications/Xcode.app` symlink pointed at 15.4 while 16.2 sat beside it.
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-ios-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ios-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Select the newest installed Xcode and report its version
        # `/Applications/Xcode.app` is a *symlink*, and on the image this job used
        # it pointed at 15.4 — while 16.2 sat beside it. `tauri ios init` writes the
        # project with XcodeGen in project format 77, and Xcode 15 refuses it with
        # "The project cannot be opened because it is in a future Xcode project
        # file format (77)". So: pick the newest by version, then assert the
        # major, rather than trusting a symlink whose target moves.
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "newest installed Xcode: $newest"
          sudo xcode-select -s "$newest"
          version="$(xcodebuild -version | head -n 1)"
          echo "$version"
          major="${version##* }"; major="${major%%.*}"
          case "$major" in
            ''|*[!0-9]*) echo "::error::cannot read an Xcode major version from '$version'"; exit 1 ;;
          esac
          if [ "$major" -lt 16 ]; then
            echo "::error::Xcode $version cannot open the project format \`tauri ios init\` writes (77). Xcode 16 or newer is required."
            exit 1
          fi
          xcrun simctl list runtimes | head -n 5

      - name: Install the pinned toolchain and the iOS targets
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Report what this host can build
        run: bun run native:doctor -- --platform ios

      - name: Generate the Xcode project
        run: bun run native:ios -- init --ci

      - name: Build the static frontend
        run: bun run --cwd apps/frontend/native build

      - name: Prove the frontend carries no server code
        run: bun run --cwd apps/frontend/native check:bundle

      - name: The launcher propagates a build failure
        # Same induction as the Android lane and the same reason: a wrapper that
        # returned 0 here would make the successful build below meaningless.
        #
        # `CC=/nonexistent/cc` was the first attempt and it does **not** work: every
        # C build script is already cached by the time this runs, so nothing
        # invokes a compiler and the build succeeds — which this step correctly
        # reported as a failure of its own premise. The linker is the reliable
        # lever, because producing a binary requires running it. A fresh
        # `CARGO_TARGET_DIR` means cargo cannot reuse anything and *has* to link.
        run: |
          set -uo pipefail
          if CARGO_TARGET_DIR="$RUNNER_TEMP/induced-target" \
             CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER="$RUNNER_TEMP/no-such-linker" \
             bun run native:ios -- build --target aarch64-sim --ci \
             >"$RUNNER_TEMP/induced-failure.log" 2>&1; then
            echo "::error::an iOS build with an unusable linker reported success"
            tail -n 40 "$RUNNER_TEMP/induced-failure.log"
            exit 1
          fi
          if ! grep -q "no-such-linker" "$RUNNER_TEMP/induced-failure.log"; then
            echo "::error::the build failed without reaching the linker, so this proved nothing"
            tail -n 40 "$RUNNER_TEMP/induced-failure.log"
            exit 1
          fi
          echo "induced failure propagated with a nonzero exit status, and reached the linker"

      - name: Build for the simulator
        run: bun run native:ios -- build --target aarch64-sim --ci

      - name: Locate the built .app
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/frontend/native/src-tauri/gen/apple -maxdepth 4 -name '*.app' -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::no .app under src-tauri/gen/apple"
            find apps/frontend/native/src-tauri/gen/apple -maxdepth 3 || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          # Named here, and NOT through `check:artifacts --name`.
          #
          # That helper names *distribution* artifacts and its extension set is
          # apk/aab/ipa. A simulator build produces an `.app` **directory** that is
          # never uploaded anywhere, and this lane previously stripped `.ipa` off
          # its name — producing a directory the next step's `find -name '*.app'`
          # could not match, so `simctl install` was handed an empty path and
          # aborted with `NSInternalInconsistencyException: installURL`. Squeezing a
          # local bundle into the store-artifact scheme would also teach the
          # artifact checker to accept a local build as a distributable one.
          name="starter-ios-aarch64-sim-${GITHUB_SHA::12}-unsigned.app"
          # A directory, so `ditto` rather than `cp -r`: `cp` does not preserve
          # the symlinks inside a built bundle's Frameworks, and the resulting
          # archive installs and then crashes on launch.
          ditto "$app" "$RUNNER_TEMP/dist/$name"
          echo "dir=$RUNNER_TEMP/dist" >> "$GITHUB_OUTPUT"

      - name: Install and launch on a simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v if x["isAvailable"] and "iPhone" in x["name"]))')"
          echo "simulator $device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          app="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.app' | head -n 1)"
          # `simctl install ""` aborts inside CoreSimulator with an
          # `installURL` inconsistency exception that names neither the path nor
          # this step. An empty path is a naming mistake upstream, and saying so
          # here is the difference between a diagnosis and a mystery.
          if [ -z "$app" ]; then
            echo "::error::no .app in $RUNNER_TEMP/dist — the locate step named it something else"
            ls -la "$RUNNER_TEMP/dist"
            exit 1
          fi
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.example.starter
          sleep 10
          # A launch that failed leaves no running process. `simctl launch`
          # prints the pid, and `get_app_container` proves the app is installed
          # as an application rather than registered and immediately killed.
          xcrun simctl get_app_container "$device" com.example.starter app
          echo "the app is installed and running on an iOS simulator"

      - name: Record what this run did and did not prove
        run: |
          echo "### iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- simulator build, unsigned, from \`macos-14\` with full Xcode: **built**." >> "$GITHUB_STEP_SUMMARY"
          echo "- installed and launched on a simulator: **yes**." >> "$GITHUB_STEP_SUMMARY"
          echo "- physical device run: **NOT RUN** — needs a provisioned device and an Apple Developer account." >> "$GITHUB_STEP_SUMMARY"
          echo "- signed archive for App Store Connect / TestFlight: **NOT RUN** — needs a development team, certificates and a profile. See .github/workflows/native-release.yml." >> "$GITHUB_STEP_SUMMARY"
          echo "- App Store upload: **NOT RUN**, deliberately." >> "$GITHUB_STEP_SUMMARY"
          echo "- authenticated sign-in and the notes path: **NOT RUN** — no deployed API is configured in this template." >> "$GITHUB_STEP_SUMMARY"
