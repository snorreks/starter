name: Workflow lint and security

on:
  push:
    branches: [main, staging, production]
    paths: ['.github/**']
  pull_request:
    branches: [main, staging, production]
    paths: ['.github/**']
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint workflow syntax and expressions
        run: actionlint -color

      # The version is explicit and the action is pinned to its audited commit.
      # Console annotations work without a paid Advanced Security subscription.
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: v1.30.1
          advanced-security: false
          annotations: true
