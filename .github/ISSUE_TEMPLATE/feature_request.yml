name: Feature request
description: Suggest a change or capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the situation and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Add links or describe other approaches you considered.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be able to help implement this.
          required: false
