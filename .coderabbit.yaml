# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI PR review configuration.
# See https://docs.coderabbit.ai/ for full documentation.
#
# CodeRabbit is advisory only — never a required check. The blocking checks are
# the self-hosted ones: `bun run guard`, `typecheck`, `lint`, and the four test
# lanes. A reviewer's opinion must never be a merge gate; a command that exits
# nonzero must be.
#
# Every path in this file was checked against the tree before being written. A
# path filter for a directory that does not exist is not a harmless no-op: it
# reads as coverage that is present. The previous version of this file pointed
# at `apps/frontend/hub`, `examples/`, `.claude/CLAUDE.md` and a `lpc` asset
# tree, none of which exist here, while saying nothing about `apps/e2e` or
# `scripts/src/guards` — which do.
#
# Tools are opt-out by default and only run when matching files change, so this
# file lists enables and deliberate suppressions only.

language: "en-US"
early_access: false
tone_instructions: "Be concise and direct. Focus on correctness, type safety, and architectural boundaries. Never comment on formatting or style — Biome owns those and runs in CI. Never praise; report only what is wrong or genuinely risky."

reviews:
    profile: assertive
    # Advisory only (see header): CodeRabbit must never post a blocking
    # "Request changes" review.
    request_changes_workflow: false
    high_level_summary: true
    poem: false
    review_status: true
    collapse_walkthrough: false
    changed_files_summary: true
    # Diagrams for a PR that restructures directories help; for a one-line fix
    # they are noise. Left on because the phases this config was written for are
    # large and structural.
    sequence_diagrams: true

    path_filters:
        # Generated / vendored — not ours to review.
        - "!**/node_modules/**"
        - "!**/dist/**"
        - "!**/build/**"
        - "!**/.svelte-kit/**"
        - "!**/coverage/**"
        - "!**/*.min.js"
        - "!**/*.min.css"
        - "!**/*.map"
        - "!**/*.lockb"
        - "!.wrangler/**"
        # Drizzle emits these; hand-review the schema, not the migration.
        - "!packages/backend/database/drizzle*/**/*.sql"
        # The Pi loader loads every module in here as an extension, so a helper
        # or a test placed in `extensions/` fails on every start. Review the
        # entrypoints, not the directory's incidental contents.
        - "!.pi/extensions/**"

    path_instructions:
        # ── Runtime boundaries — the rules a reviewer can't infer from the file ──
        #
        # Three boundaries, each enforced twice (Biome's import rules and
        # `bun run guard`), so a review that contradicts them should be corrected
        # rather than obeyed. See AGENTS.md.

        - path: "apps/frontend/client/src/lib/server/**"
          instructions: |
              The Worker half of the one application, in workerd (module format).
              `nodejs_compat` is on, so the supported `node:*` subset is allowed, but
              flag anything the Workers runtime cannot do at request time:
              filesystem access, `child_process`, native addons, long-lived
              module-scope mutable state shared across requests, or blocking sync
              I/O.

              Data access is D1 through the `DB` binding — never a direct network DB
              driver. Auth is Better Auth, built once per (binding set, origin) in
              `container.ts`.

              Deployment mode is explicit and fails closed: `DEPLOYMENT_ENV` decides
              whether development defaults are permitted, it is never inferred from
              a URL, and a missing or unrecognised value is an error rather than a
              default. `BETTER_AUTH_URL` must be structurally valid and https
              outside local, and the development placeholder secret is refused
              remotely even when supplied explicitly. Flag any change that
              reintroduces a default here — that is the exact regression this
              boundary exists to prevent.

        - path: "scripts/src/deploy/**"
          instructions: |
              One configuration authority, four deployment phases. Read
              docs/deployment.md before changing anything here.

              `target.ts` is the authority: every command that can reach a remote
              resource resolves its destination through `resolveTarget` and nothing
              else resolves one independently. Two lookups that are each correct
              about different things is how a deploy migrates staging while
              publishing production. Flag any new code path that reads
              `DEPLOYMENT_CONFIG` or `.starter/deployment.local.json` directly to
              decide a destination.

              `resolveTarget` refuses rather than defaults, for four reasons that are
              all load-bearing: an unknown environment, a null value, two
              environments sharing a Worker or a D1 database, and an origin that is
              not an absolute https URL. Never soften one into a fallback.

              Phase authority is the design: `plan` must work with no credential and
              no network (it runs on fork pull requests), `preflight` is read-only,
              and only `apply` mutates, and only with `--yes`. Flag a change that
              lets any of them reach an authenticated or mutating path they should
              not.

              A secret never goes in argv. `credentials.ts` refuses `--api-token`,
              `--var NAME:value` with a secret-bearing name, and the bare
              `--var NAME value` spelling. Do not add another way to pass one; use
              the secret channel.

              Account ids, Worker names, database ids and public origins are
              configuration, not secrets, and belong in the gitignored overlay. A
              token, a private key or a mail API key does not.

              `release.ts` records what happened. It never decides whether to deploy:
              no fingerprint cache, no skip-if-unchanged. `digestArtifact` hashes file
              paths and contents; it must not include a timestamp, a hostname or a
              secret, or two builds of the same tree stop agreeing.

              Tests for this directory belong in `scripts/tests/deployment_*.test.ts`
              and must assert the argv or the HTTP request that was produced, not
              only a returned object. A test asserting a helper's return value
              passes while the helper spawns nothing — which is how `e2e:test` once
              resolved to an `echo` and the suite stayed green.

        - path: ".github/workflows/deploy.yml"
          instructions: |
              The only path that deploys. Three properties that must not regress:

              `cancel-in-progress: false` on the apply job's concurrency group.
              Cancelling a run halfway through `d1 migrations apply` leaves a schema
              ahead of the code running on it, with no record that anything was in
              flight. The group is keyed on the destination environment, so two
              applies to staging queue and staging does not block production.

              `on: workflow_dispatch` only. An unconfigured template must not publish
              itself when a commit lands. Do not add `push` or `pull_request`.

              No credential on any job that does not need one, and `environment:` on
              the job that does, so environment protection and environment-scoped
              secrets apply without any logic in the file. This repository does not
              change remote repository settings; create the environments once, as an
              operator.

              Do not introduce a lock file. A lock in a checkout serialises one
              developer's machines and nothing else; the environment concurrency
              group is the only global serialisation actually claimed here.

        - path: "apps/frontend/client/src/routes/health/**"
          instructions: |
              Public, unauthenticated, `no-store`. Everything in the response is
              published, so it must contain no secret, no binding value, no account
              id, no database id and no stack trace. `release` is a git SHA, which
              is public by construction.

              `/health` reads configuration only and must not touch the database: a
              load balancer polling a database-backed liveness probe couples routing
              health to database latency and pulls every Worker out of rotation while
              the application still serves. `/health/ready` is the endpoint that
              exercises the bindings, with a bounded `SELECT 1` — it measures the
              binding, not the data. Do not merge them.

        - path: "apps/frontend/client/src/hooks.server.ts"
          instructions: |
              The composition root. Four jobs in this order: bindings to container,
              request to identity, unrouted `/api/*` to a JSON 404, and the cache
              policy. `locals.user` is resolved per request and must never be cached
              on the module — a Worker isolate serves concurrent requests and the last
              writer would win for all of them. A configuration failure is caught
              here and answered with a 503 naming the binding, never an opaque 500.

              `cachePolicyFor` marks every `/api/*` response and every signed-in page
              `private, no-store`. Anonymous HTML is deliberately left alone:
              whether a page is anonymous depends on the session, not the URL, so a
              blanket `public` would be a correctness claim this code cannot verify.

              Never `fetch()` this app's own origin, and never let an unrouted
              `/api/*` path fall through to SvelteKit's HTML error page: a client
              that received HTML has to guess between a wrong URL and a broken
              deploy.

        - path: "apps/frontend/client/src/routes/**/+server.ts"
          instructions: |
              A thin adapter over `#lib/server/*_service.ts`: resolve identity,
              validate the body against the shared schema, map a result to a
              status. No SQL, no ownership rule and no domain logic belong here —
              the service is also reached from a `+page.server.ts`, and a rule that
              lives in only one of the two is a rule that will drift.

              Every refusal uses the same `{ error, message }` shape from
              `#lib/server/http.ts`. Return the wire DTO, never a database row:
              this response is serialized.

              Never `fetch()` this app's own origin. There is one production router,
              and a round trip to `/api/notes` from inside the process that serves
              `/api/notes` is a second, differently authenticated path to the same
              data.

        - path: "apps/frontend/client/src/**"
          instructions: |
              The BROWSER half, except for the five server-plane shapes named above.
              One SvelteKit package holds two runtimes; this instruction describes
              the one that runs in a page.

              No `node:*` imports in this path — it ships to a browser, and
              `@starter/utils` is linked into this bundle, which is why `killTree`
              lives on the `@starter/utils/process` subpath and is deliberately
              absent from the package barrel.

              Never import `@starter/database`, `@starter/auth`, `drizzle-orm` or
              `better-auth`. Persistence goes through the client service layer over
              HTTP. `bun run check:bundle` scans the built client chunk for the
              markers minification leaves behind, so a leak fails the build rather
              than shipping.

              The API base URL is `''` — this origin. `PUBLIC_API_BASE_URL` exists
              only to point a browser at a different deployment while debugging.

        - path: "apps/e2e/**"
          instructions: |
              Playwright specs and the harness that starts the real client and the
              real Worker. A test here must fail when the behaviour it names breaks
              — an assertion that cannot fail is the failure this lane exists to
              catch. The lane requires `node` on PATH (a Wrangler program without
              it never starts) and a Chromium that links against this host's libc.

        - path: "packages/shared/**"
          instructions: |
              The portable core: runs in browser, Worker and Bun. These packages
              import nothing from `apps/` or `scripts/`. Flag any import that binds
              this code to one runtime — `node:*`, browser globals, a server-only
              dependency — and any new third-party dependency that is not
              runtime-neutral.

        - path: "packages/frontend/**"
          instructions: |
              Browser only. No `node:*` imports, no database or backend service
              imports. Svelte 5 runes; View/ViewModel separation. Note that feature
              components (e.g. NoteCard) live in the feature folder, not in a shared
              UI package, once they are specific to one feature.

        - path: "packages/backend/**"
          instructions: |
              Backend only. No browser APIs. `AppError` for error paths
              (`@starter/utils`), service/repository layering, DB access via
              repositories.

        - path: "apps/frontend/client/src/routes/**/+page.server.ts"
          instructions: |
              An SSR load. It calls the service DIRECTLY by importing
              `#lib/server/*_service.ts` — it must not `fetch()` its own origin, and
              a load that does is the second path this architecture exists to avoid.

              Anonymous means redirected, not rendered. Build the ViewModel's initial
              state from the load rather than fetching on mount, so there is no
              window in which the page shows an empty list before its data arrives.

              What goes into `data` is serialized into the HTML. Return the DTO from
              `@starter/schemas`; never spread a session user, a binding, or a
              service instance.

        # ── Patterns Biome and tsc cannot check ─────────────────────────────
        - path: "**/*.svelte"
          instructions: "Svelte 5 runes ($state, $derived, $effect). Views stay logicless — logic belongs in the ViewModel."

        - path: "**/*_view_model.svelte.ts"
          instructions: |
              ViewModel state via $state runes. No direct database/driver access —
              go through a service or repository.

              Mutation lifecycle invariants, each with a regression test: a write
              that completes after `dispose()` must be discarded; optimistic
              rollback must restore only the rows that update itself changed, never
              clobber a row another writer deleted; and `isMutating` must stay true
              until the last in-flight mutation settles, not the first.

        - path: "**/*.test.ts"
          instructions: |
              Tests should assert behaviour, not implementation. Flag tests that
              would pass vacuously: empty fixture globs, unasserted promises,
              assertions that can never fail, and a count assertion that is not
              there when the count is the point.

              A test whose subject is a file path must fail loudly when that file
              moves, not report ENOENT — a moved file is a broken invariant, and a
              bare "no such file" reads like a broken checkout instead.

        - path: ".github/workflows/*.yml"
          instructions: |
              Pin third-party actions to a full commit SHA, avoid `${{ }}`
              interpolation inside run blocks, set explicit least-privilege
              `permissions`.

              Note that `BUN_VERSION` here is a literal, not a read of
              `.bun-version`: Actions cannot read a file into a workflow-level
              `env:`. It is a second source of truth, and the `version-mirrors`
              guard is what keeps it in agreement with `config/toolchain.json`.
              Flag any edit that changes one without the other.

              CI must never deploy, and must never need a credential: `pull_request`
              from a fork gets no secret even if one existed. Deployment lives in
              `deploy.yml` on a separate event for exactly that reason.

        - path: "scripts/**"
          instructions: |
              Bun CLI tooling, one dispatcher at `src/cli.ts` with domain modules
              beside it. Flag hardcoded absolute paths, secrets in source, and
              unchecked subprocess exit codes — a command that succeeds while doing
              nothing is worse than one that fails.

              A command with no adapter must exit nonzero with an explanation and
              the invocation that would work. Never replace required functionality
              with an echo, an always-zero exit, a blanket skip or a weakened
              assertion.

              Guard tasks run with `options.cache: false` because they read files
              outside the project that Moon cannot hash. Flag a change that
              re-enables caching there, or adds a guard whose subject is a file
              the task does not declare: it would report `ok` on real drift.

    auto_review:
        enabled: true
        drafts: false
        # Pause automatic incremental reviews immediately after the first review pass
        auto_pause_after_reviewed_commits: 1
        base_branches:
            - main
        ignore_title_keywords:
            - "WIP"
            - "wip"
            - "DO NOT MERGE"
            - "draft"

    tools:
        biome:
            enabled: true
        shellcheck:
            enabled: true
        actionlint:
            enabled: true
        zizmor:
            enabled: true
        markdownlint:
            enabled: true
        yamllint:
            enabled: true
        gitleaks:
            enabled: true
        # Dependency CVE scanning against bun.lock — pairs with Renovate.
        osvScanner:
            enabled: true

        # Deliberate suppressions: review does not add value here.
        # Biome owns JS/TS linting; a second opinion is pure duplicate noise.
        eslint:
            enabled: false
        oxc:
            enabled: false
        # No Rust in this repository. The native shell was removed in PR A; if one
        # comes back it needs its own `moon` task before clippy is worth enabling.
        clippy:
            enabled: false
        # There are no Dockerfiles in this repository.
        hadolint:
            enabled: false

    finishing_touches:
        autofix:
            enabled: true
        fix_ci:
            enabled: true
        resolve_merge_conflict:
            enabled: true
        docstrings:
            enabled: false
        unit_tests:
            enabled: false
        simplify:
            enabled: false

    pre_merge_checks:
        title:
            mode: warning
            requirements: "Conventional commit prefix (feat:, fix:, chore:, refactor:, docs:) and under 72 characters."
        description:
            mode: warning
        docstrings:
            mode: "off"

chat:
    auto_reply: true

knowledge_base:
    code_guidelines:
        enabled: true
        filePatterns:
            - "AGENTS.md"
            - ".pi/skills/**/SKILL.md"
            - "docs/architecture.md"
            - "docs/deployment.md"
    learnings:
        scope: local
    web_search:
        enabled: true
