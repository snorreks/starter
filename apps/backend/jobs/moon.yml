$schema: 'https://moonrepo.dev/schemas/project.json'

# apps/backend/jobs/moon.yml
#
# The scheduled jobs Worker: two Workflows, one container Durable Object, and the
# bounded maintenance they run.
#
# Task names follow the media crate's precedent and its reason: this project
# publishes no `test`/`lint` task for the *compute* lane, because the root
# scripts run Moon by task name (`bun run test` is `:test`, `bun run lint` is
# `:lint`). A project named `test` would silently join the credential-free web
# lanes, and the compute lane needs a Docker engine. So:
#
#   test              unit lane (src/**/*.test.ts) — no Docker, no D1, no network
#   test-compute      the real local Workflows + D1 + R2 + a real FFmpeg container
#   build             the Worker bundle `wrangler deploy` would ship
#   check-config      the schedule invariants, read from the committed config
#
# `test-compute` is never cached: it asserts against a running runtime, a real
# database, a real bucket and a real container, so a restored "pass" would
# certify processes this run never started.

layer: 'application'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
    - 'wrangler.jsonc'
  workspaceSources:
    - '/packages/backend/jobs/src/**/*'
    - '/packages/backend/database/src/**/*'
    - '/packages/backend/database/drizzle-d1/**/*'
    - '/packages/shared/schemas/src/**/*'
    - '/packages/shared/utils/src/**/*'
    - '/packages/shared/logger/src/**/*'
  tests:
    - 'tests/**/*'
    - 'scripts/**/*'

toolchains:
  bun:
  javascript:

dependsOn:
  - database
  - jobs
  - schemas
  - utils

tasks:
  build:
    command: 'bun'
    args: ['run', 'build']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(workspaceSources)'
    outputs:
      - 'dist'

  check-config:
    command: 'bun'
    args: ['run', 'check:config']
    inputs:
      - '@group(configs)'
      - '@group(workspaceSources)'
      - '@group(sources)'
      - '@group(tests)'

  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
      - '@group(workspaceSources)'

  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
      - '@group(workspaceSources)'

  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
      - '@group(workspaceSources)'

  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
      - '@group(workspaceSources)'

  # Unit lane. No Docker, no local runtime, no credentials: these tests assert
  # the parts that are this repository's own — key derivation, refusal
  # classification, protocol validation, schedule configuration.
  test:
    command: 'bun'
    args: ['run', 'test']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(workspaceSources)'

  # The compute lane. Requires a Docker-compatible engine and runs the built
  # Worker in the real local Workers runtime (wrangler's own miniflare) with real
  # local D1 and R2, a real Workflows engine and the real FFmpeg image.
  test-compute:
    command: 'bun'
    args: ['run', 'test:compute']
    # The lane drives the **built** bundle, so the build is a real dependency rather
    # than a step somebody has to remember. `client:test-worker` does the same, and a
    # lane that silently tested the previous build is exactly what `check:bundle`
    # exists to prevent in the other direction.
    dependsOn:
      - '~:build'
    options:
      cache: false
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
      - '@group(workspaceSources)'

  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'
      - '~:check-config'