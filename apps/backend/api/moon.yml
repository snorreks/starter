$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# Tasks are delegations to this project's own package.json script.
#
# Two things worth noting:
#
#   * `test` was `echo "no unit tests: ..."`. An `echo` that exits 0 inside a
#     `:test` fan-out is indistinguishable from a passing lane, which is how a
#     suite can report green having run nothing. It now runs `bun test src`, which
#     discovers the environment-resolution tests in `src/env.test.ts`.
#   * `test-integration` is a distinct task from `test` because it needs a local
#     D1 database and takes minutes. Folding it into `test` would make every unit
#     run pay for it, and excluding it would make `test` look like coverage.
layer: 'application'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
    - 'wrangler.jsonc'
  tests:
    - 'src/**/*.test.ts'
    - 'tests/**/*'

toolchains:
  bun:
  javascript:

dependsOn:
  - auth
  - database
  - logger
  - schemas
  - utils

tasks:
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  test:
    command: 'bun'
    args: ['run', 'test']
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  # Starts a local D1 database, applies migrations and drives the real Worker.
  # Never cached: it asserts against a database and a running workerd, so a
  # restored "pass" would certify processes this run never started.
  test-integration:
    command: 'bun'
    args: ['run', 'test:integration']
    deps:
      - '~:db-migrate-local'
    options:
      cache: false

  # A remote-capable migration is never a task; this is the local-only helper the
  # integration lane depends on. `bun run db:migrate --remote <env> --yes` is the
  # operator command and stays outside Moon on purpose.
  db-migrate-local:
    command: 'bun'
    args: ['run', '--cwd', '../../..', 'db:migrate']
    options:
      cache: false

  # No build step: the deployable unit is Wrangler's bundle of `src/`, produced
  # at deploy time. See docs/cloudflare.md.
  build:
    command: 'echo'
    args: ['nothing to build (Worker source; wrangler bundles it at deploy time)']

  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'