<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!--
      `viewport-fit=cover` so a future mobile build can paint under a notch.
      The desktop window has no safe area to respect, and asking for one is
      harmless: it only takes effect where there is something to inset.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Starter</title>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
