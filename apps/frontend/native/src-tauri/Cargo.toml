# apps/frontend/native/src-tauri/Cargo.toml
#
# The native shell.
#
# Deliberately minimal. It provides a window, a secure context, and native log
# capture — nothing else. Every plugin in this file is a capability the template
# actually exercises, because an unused plugin in a template is an unused attack
# surface that the next person has to audit instead of delete.
#
# Exact version pins with `=`, matching the media crate and the Bun rule. A
# drifting resolver is how a desktop build starts failing for reasons unrelated to
# the change under review, and `Cargo.lock` is committed and used with `--locked`.
#
# ONE pin is not in this manifest because it is transitive: `libc` is held at
# 0.2.189 by the lockfile rather than here. `libc 0.2.190` gated
# `mach_task_self()` behind `#[cfg(target_os = "macos")]`, and the unmaintained
# `num_threads 0.1.7` calls exactly that function for `target_os = "ios"` —
# reached through `time`, which `cookie`, `plist`, `tauri-codegen` and
# `tauri-plugin-log` all need. `num_threads` has had no release since 0.1.7, so
# there is no upgrade path and the lockfile is the only lever:
#
#     cargo update -p libc --precise 0.2.189
#
# `scripts/tests/cargo_ios_pins.test.ts` fails the build when `libc` climbs back
# above it, because a lockfile pin is durable only until somebody runs
# `cargo update`. Without that test the next routine update restores a broken iOS
# build, and the symptom is a CI error naming a crate this repository does not
# depend on.
#
# No updater, no signing keys, no sidecars. An updater needs an endpoint and a
# keypair that belong to whoever ships the app; a sidecar is a binary the template
# author chose. Both are the adopter's, and `docs/native.md` says how to add them.

[package]
# Neutral. A template's identifier must not name the project it came from: it is
# written into every user's bundle id, their install path and their signing
# identity, and changing it after the first release is not free.
name = "starter"
version = "0.1.0"
description = "A Bun + SvelteKit + Cloudflare starter, wrapped for desktop and mobile."
authors = ["you"]
edition = "2021"
rust-version = "1.98"

# The library target, so the same code can be built as a mobile app library as
# well as a desktop binary. See `src/lib.rs`.
[lib]
name = "starter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde_json = "=1.0.151"
# Structured native logs, forwarded to the same NDJSON the other log producers
# write, so one `bun run logs` covers the app and the Worker.
tauri-plugin-log = "=2.10.0"
# Hands an approval URL to the user's own browser. See
# `src/lib/platform/external_browser.ts` for why this is a capability and not a
# webview.
tauri-plugin-opener = "=2.7.0"
# Routes the one configured PKCE callback back to the native app.
tauri-plugin-deep-link = "=2.6.1"
# The encrypted vault behind opt-in "remember me". Cross-platform on desktop and
# mobile; the passphrase is the user's and is never stored. The key is derived
# from it with argon2id in `src/lib.rs`.
tauri-plugin-stronghold = "=2.4.0"
# Argon2id, used only to turn the user's passphrase into the 32-byte snapshot
# key. `alloc` alone is enough: the shell calls `hash_password_into` and nothing
# else, so the password-hash and getrandom halves of the crate are not pulled in.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# Forward callback URLs from subsequent launches to the running desktop process.
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }

[features]
# Enabled by `tauri dev`, not in a shipped build. A custom protocol that serves
# the frontend is only correct against a built bundle.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# Smaller binary. A debug-symbol full build of this shell is roughly 300 MB, which
# is a poor first impression for anyone who runs `cargo build --release` to check
# it compiles.
strip = true
