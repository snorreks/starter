$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# Tasks are delegations to this project's own package.json script, which is the
# authority for what the script does. Two exceptions, both stated here because a
# task that is not a delegation is worth a reader noticing:
#
#   * `build` was `echo "nothing to build (TypeScript source)"`, which made
#     `bun run build` at the repository root a command that printed a message.
#     It produces `.svelte-kit/cloudflare/` — the Worker plus its static assets —
#     and both the E2E lane and `check:bundle` need it to exist.
#   * `test-browser` is separate from `test` so the browser lane can be invoked,
#     cached and failed independently. Folding it into `test` meant `test:all`
#     ran it twice, once via `moon run :test` and once explicitly.
layer: 'application'

fileGroups:
  sources:
    - 'src/**/*'
    - '*.ts'
    - 'static/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
    - 'vite.config.ts'
    - 'vitest.config.ts'
    - 'wrangler.jsonc'
  tests:
    - 'src/**/*.test.ts'
    - 'src/**/*.spec.ts'
    - 'src/browser_tests/**/*'
    # `tests/` holds `worker_integration.test.ts` and `scripts/` holds
    # `check_bundle.ts` plus its own tests. `bun run test:unit:run` executes all
    # of them — `bun test … src/lib tests scripts` — so while this group was
    # unreferenced, four test files and two helpers ran outside every cache key.
    - 'tests/**/*'
    - 'scripts/**/*'

toolchains:
  bun:
  javascript:

dependsOn:
  # `database` and `auth` are here because the server half of *this* project
  # imports both. They were dependencies of a separate `api` project before the
  # two halves became one application, and leaving them out would let a build
  # succeed against a stale copy of the schema it persists to.
  - auth
  - database
  - logger
  - schemas
  - ui
  - utils

tasks:
  # `dev` delegates to the CLI, which is the single implementation of "run the app
  # locally": it owns the per-checkout pid file, the log capture and the signal
  # forwarding. This task exists so `moon run client:dev` also works. A second
  # implementation here is exactly how the old two-process setup came to disagree
  # about ports and about teardown.
  dev:
    command: 'bun'
    args: ['run', 'dev']
    preset: 'server'

  # The dev server without the CLI wrapper: no log capture, no pid file, no signal
  # forwarding. It exists for the E2E harness, which starts and stops the server
  # itself and must own that lifecycle. `bun run dev` is the command for a human.
  dev-worker:
    command: 'bun'
    args: ['run', 'dev:worker']
    preset: 'server'

  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'

  # Unit only. The browser lane is `test-browser` and the Worker lane is
  # `test-worker`; neither is folded in, for the same reason.
  test:
    command: 'bun'
    args: ['run', 'test']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'

  test-browser:
    command: 'bun'
    args: ['run', 'test:browser']
    # `output` stays unset because vitest writes reports into the tree, so there is
    # no clean artifact to restore.
    #
    # Caching is allowed, and was previously described here as unsafe until the
    # input set was real. It is real now: `@group(tests)` covers the browser specs
    # under `src/browser_tests/` and `tests/`, and `@group(configs)` covers
    # `vitest.config.ts`. What Moon still cannot see — `bun.lock`, and the shared
    # browser resolver outside this project — is exactly what
    # `scripts/src/ci/cache_scope.ts` watches: `bun run test:browser` switches Moon
    # to `--cache off` when either moves, so a hit here always describes this tree.
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'

  # The built Worker, in real workerd, against real local D1. Never cached: it
  # asserts against a database and a running runtime, so a restored "pass" would
  # certify processes this run never started.
  test-worker:
    command: 'bun'
    args: ['run', 'test:worker']
    deps:
      - '~:build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'
    options:
      cache: false

  build:
    command: 'bun'
    args: ['run', 'build']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(tests)'
    # The one task in the workspace with a restorable output.
    #
    # Build closes the adapter's SSR graph with pinned Wrangler before caching.
    # `.svelte-kit/cloudflare` is then a complete artifact: a restored copy is the
    # Worker plus its assets, not an entry importing uncached intermediate trees. `check:bundle` and the
    # Worker lane both consume it, so a hit saves a real build.
    #
    # It is not, on its own, sufficient: the build reads `bun.lock`, the
    # `@starter/*` package sources (aliased straight to their `src/`, outside this
    # project), `svelte-kit sync` output and the public build environment. A
    # task input may not contain `..`, and `fileGroups` reject it too, so the
    # first two cannot be declared here at all. `scripts/src/ci/cache_scope.ts`
    # fingerprints them and switches Moon to `--cache off` when they move;
    # `wrangler.jsonc` covers the environment, and the generated types are
    # produced by this task itself.
    outputs:
      - '.svelte-kit/cloudflare'

  check-bundle:
    command: 'bun'
    args: ['run', 'check:bundle']
    deps:
      - 'build'
    # Never cached: it inspects `.svelte-kit/cloudflare/`, and a restored result
    # would be a claim about an artifact this run did not produce.
    options:
      cache: false

  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'
