$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# The end-to-end project: Playwright specs, the harness that starts the server,
# visual capture, serialized Lighthouse and the explicit Docker media journey.
#
# The harness, validated scenario data, references and reviewed browser baselines
# are all explicit Moon inputs. Runtime observations stay uncached.
# `automation` is Moon's layer for "an automated testing suite, like E2E,
# integration, or visual tests". It matters because `tool` may not depend on
# `application`, and this project genuinely drives the application.
layer: 'automation'

fileGroups:
  sources:
    - '*.ts'
    - 'src/**/*'
    - 'scripts/**/*'
  scenarios:
    - 'src/scenarios/**/*'
  references:
    - 'references/**/*'
  baselines:
    - 'tests/visual/**/*-snapshots/**/*'
    - 'baselines/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
    - 'playwright.config.ts'
    - 'playwright.visual.config.ts'
    - 'playwright.full.config.ts'
    - 'playwright.audit.config.ts'
  tests:
    # One name for one thing. `specs` and `tests` were both `tests/**/*`, and
    # every task referenced `specs` while `tests` was left declared and
    # unreferenced — fourteen such groups existed across the workspace, each one
    # a promise nothing checked.
    - 'tests/**/*'

toolchains:
  bun:
  javascript:

dependsOn:
  - client
  - database
  - schemas
  - fixtures

tasks:
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(scenarios)'
      - '@group(references)'
      - '@group(baselines)'
      - '@group(tests)'
      - '@group(configs)'
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(scenarios)'
      - '@group(references)'
      - '@group(baselines)'
      - '@group(tests)'
      - '@group(configs)'
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(scenarios)'
      - '@group(references)'
      - '@group(baselines)'
      - '@group(tests)'
      - '@group(configs)'
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(scenarios)'
      - '@group(references)'
      - '@group(baselines)'
      - '@group(tests)'
      - '@group(configs)'

  # The real Playwright suite. Not cached: it builds the Worker, starts it in
  # workerd, starts a browser, migrates a database, and asserts against them. A
  # cached "pass" would certify a server and a database that were never started.
  #
  # It also has no `inputs`, deliberately. The whole tree is in scope, and this
  # project's results depend on the built client, the Supabase state under
  # `.wrangler/`, and the port the harness binds — none of which Moon can key.
  e2e:
    command: 'bun'
    args: ['run', 'test:e2e']
    options:
      cache: false

  test:
    command: 'bun'
    args: ['run', 'test:tooling']
    inputs:
      - '@group(sources)'
      - '@group(scenarios)'
      - '@group(tests)'
      - '@group(configs)'
      - '/apps/frontend/client/src/routes/**/*'
      - '/apps/frontend/native/src/routes/**/*'

  capture-evidence:
    command: 'bun'
    args: ['run', 'capture-evidence']
    options:
      cache: false

  visual:
    command: 'bun'
    args: ['run', 'test:visual']
    options:
      cache: false

  audit:
    command: 'bun'
    args: ['run', 'test:audit']
    options:
      cache: false

  full:
    command: 'bun'
    args: ['run', 'test:full']
    options:
      cache: false

  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'
