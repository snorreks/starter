$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# The end-to-end project: Playwright specs, the harness that starts the server,
# and the visual-capture command.
#
# This project has no `src/` directory. Every file that matters is a top-level
# TypeScript module (the harness, the config, the preflight) or lives in `tests/`.
# The previous `sources` group was `src/**/*`, which matched nothing at all — so
# `e2e:test` hashed to an empty input set, was reported "cached", and its command
# was an `echo`. A file group that matches nothing is a cache key that never
# changes; see docs/testing.md.
# `automation` is Moon's layer for "an automated testing suite, like E2E,
# integration, or visual tests". It matters because `tool` may not depend on
# `application`, and this project genuinely drives the application.
layer: 'automation'

fileGroups:
  sources:
    - '*.ts'
  specs:
    - 'tests/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
    - 'playwright.config.ts'
  tests:
    - 'tests/**/*'

toolchains:
  bun:
  javascript:

dependsOn:
  - client
  - database
  - schemas

tasks:
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(specs)'
      - '@group(configs)'
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(specs)'
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(specs)'
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(specs)'

  # The real Playwright suite. Not cached: it builds the Worker, starts it in
  # workerd, starts a browser, migrates a database, and asserts against them. A
  # cached "pass" would certify a server and a database that were never started.
  e2e:
    command: 'bun'
    args: ['run', 'test:e2e']
    options:
      cache: false

  capture-evidence:
    command: 'bun'
    args: ['run', 'capture-evidence']
    options:
      cache: false

  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'