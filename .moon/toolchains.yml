# Toolchain resolution for Moon.
#
# `.bun-version` at the repository root is the single source of truth for the Bun
# version. It is what `oven-sh/setup-bun` reads in CI and what a developer reads to
# know what they need. `.github/workflows/ci.yml` pins the same value.
#
# The `version` key is deliberately absent from the `bun` toolchain here.
#
# Moon runs the Bun executable on PATH and does not require Proto when no version
# is requested. `.bun-version` remains authoritative through Nix, CI, setup doctor
# and the version-mirrors guard.

bun: {}

javascript:
  packageManager: 'bun'
  syncProjectWorkspaceDependencies: true
