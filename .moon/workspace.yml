# .moon/workspace.yml
#
# Moon v2 workspace.
#
# Two keys were removed from this file in Moon 2.x and it had not been migrated:
# `layers` and `dependencyRules`. A config that fails to parse makes *every*
# `moon run` fail, so `bun run test`, `bun run typecheck`, `bun run lint` and the
# rest of the root scripts did not work at all — the reason each lane in this
# repository is invoked directly rather than through them.
#
# The dependency graph is not lost. Moon 2 expresses it per project, as
# `implicitDependencies` in each project's moon.yml, which is where it now lives
# and where it is more useful: it sits next to the package.json that declares the
# real dependencies, so the two can be compared.
#
# The architecture rules themselves are enforced by two independent mechanisms:
#   - Biome, which checks import statements (docs/lint.md)
#   - `bun run guard`, which checks layer membership, request state, gitignored
#     source, registry self-consistency and version mirrors
#     (scripts/src/guards/boundary.ts)
# Neither relies on this file, so a Moon upgrade cannot silently drop a rule.

$schema: 'https://moonrepo.dev/schemas/v2/workspace.json'

projects:
  # Tooling. Runs outside both planes; may import shared only.
  scripts: 'scripts'
  pi: '.pi'

  # Applications.
  #
  # One application, not two. `api: 'apps/backend/api'` was removed with the
  # application it pointed at: a separate Elysia Worker that the browser reached
  # through a Vite proxy. The browser half and the Worker half are now the same
  # SvelteKit project, so there is one project here and its two runtimes are a
  # property of the source layout, not of the build graph.
  client: 'apps/frontend/client'
  # Root :test includes the native Bun tests in src/ and scripts/; :lint and
  # :format cover src/, and :typecheck runs svelte-check. This project defines no
  # Cargo tasks: Rust formatting, clippy and tests run in the native CI workflow.
  native: 'apps/frontend/native'
  e2e: 'apps/e2e'

  # Shared packages: portable, no project dependencies at all.
  schemas: 'packages/shared/schemas'
  logger: 'packages/shared/logger'
  utils: 'packages/shared/utils'

  # Frontend packages: browser code. Shared only.
  #
  # `frontend-services` is gone. It held a three-deep base-class chain
  # (BaseFrontendClass -> BaseViewModel -> BaseFormViewModel) with three subclasses
  # in the whole repository and thirteen members that had no caller at all. The
  # parts that were load-bearing — StaleGuard, MutationGuard, OptimisticUpdate —
  # were already in `@starter/utils`, and the one component that needed to survive
  # moved into `@starter/ui` beside the components it renders.
  ui: 'packages/frontend/ui'
  # `platform` is the contracts a host implements; `features` is the notes and
  # account screens built on them. Both are browser-plane code that any host can
  # render — the SSR web application today, a static native bundle next. Neither
  # may import an application, a SvelteKit router or a Tauri bridge; `bun run
  # guard` refuses each of those edges, which is what keeps one copy of a screen
  # honest for two hosts.
  platform: 'packages/frontend/platform'
  features: 'packages/frontend/features'

  # Backend packages: server code. Shared only.
  database: 'packages/backend/database'
  auth: 'packages/backend/auth'

  # Compute. A Rust/FFmpeg processor that runs in a container, not on the
  # Worker's plane: it has no D1, no R2, no bindings and no credentials, and the
  # jobs Worker reaches it over an internal port. Its Moon tasks are named
  # `cargo-*` on purpose — see apps/backend/media/moon.yml for why they do not
  # join the `:test`/`:lint` selectors the web lanes run without a Rust toolchain.
  media: 'apps/backend/media'

vcs:
  # `manager` was renamed to `client` in Moon 2.x.
  client: 'git'
  # `origin/main`, not `main`. A pull-request checkout is a detached HEAD: it has
  # no local `main`, so every job died with
  #   fatal: ambiguous argument 'main': unknown revision or path not in the working tree
  # before running a single test. The remote-tracking ref is the one ref
  # `actions/checkout` always creates, and `git rev-parse origin/main` resolves in
  # both a push and a pull-request checkout.
  #
  # `fetch-depth: 0` in ci.yml is still required — without it the merge base does
  # not exist either — but on its own it is not sufficient, because a full clone
  # still has `main` only as a remote ref. Both halves are needed; each was found
  # by reproducing the failure locally rather than by reading the error once.
  defaultBranch: 'origin/main'

# ── What Moon's cache can and cannot see here ──────────────────────────────────
#
# Every project sets `options.cache: false`. That is not caution, and it is not
# that the tasks are impure; it is that Moon 2.5.5 cannot build a key equal to
# the set of files these commands read. Both halves were measured on this
# workspace, not inferred from documentation.
#
# 1. A task cannot name a file outside its project. `'../../biome.json'` is
#    rejected at parse time:
#
#      tasks.probe.inputs[1]: parent directory traversal (..) is not supported
#
#    and `fileGroups` are accepted only at project scope in 2.5.5 — the
#    workspace schema has no `fileGroups` key, and its `hasher` block offers
#    only `ignorePatterns`, `ignoreMissingPatterns`, `optimization` and
#    `walkStrategy`. So `bun.lock`, root `package.json`, `bunfig.toml`,
#    `biome.json`, `config/toolchain.json` and every `config/tsconfig/*.json` is
#    unreachable from any task. Those files decide the result of every task in
#    this workspace: the lockfile fixes the compiler, the linter and the test
#    runner, and `config/tsconfig/` is the `extends` chain for nine projects.
#
# 2. A task's key does not include its dependencies' keys. With
#    `utils:test` declaring `deps: ['logger:test']`, editing
#    `packages/shared/logger/src/index.ts` re-ran `logger:test` under a new hash
#    while `utils:test` reported `cached, 2b8e371c` — the same hash as before.
#    `dependsOn` orders the graph; it does not propagate content.
#
# A cached hit therefore asserts something about files Moon never looked at. The
# cache is not disabled globally, because that would be a habit rather than a
# decision: `bun run scripts/src/cli.ts cached -- <targets>` turns Moon's own
# `--cache` mode on and off from a fingerprint over exactly the files listed in
# (1) plus every workspace package's sources. When the fingerprint is unchanged
# the tasks run `--cache read-write` and hit; when anything it cannot see moved,
# they run `--cache off` and everything re-runs. It fails closed: an unreadable
# fingerprint means `--cache off`.
#
# `scripts/tests/cache_scope.test.ts` proves both halves of that on this
# workspace, including the negative control.