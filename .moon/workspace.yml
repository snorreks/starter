# .moon/workspace.yml
#
# Moon v2 workspace.
#
# Two keys were removed from this file in Moon 2.x and it had not been migrated:
# `layers` and `dependencyRules`. A config that fails to parse makes *every*
# `moon run` fail, so `bun run test`, `bun run typecheck`, `bun run lint` and the
# rest of the root scripts did not work at all — the reason each lane in this
# repository is invoked directly rather than through them.
#
# The dependency graph is not lost. Moon 2 expresses it per project, as
# `implicitDependencies` in each project's moon.yml, which is where it now lives
# and where it is more useful: it sits next to the package.json that declares the
# real dependencies, so the two can be compared.
#
# The architecture rules themselves are enforced by two independent mechanisms:
#   - Biome, which checks import statements (docs/lint.md)
#   - `bun run guard`, which checks layer membership, request state, gitignored
#     source, registry self-consistency and version mirrors
#     (scripts/src/guards/boundary.ts)
# Neither relies on this file, so a Moon upgrade cannot silently drop a rule.

$schema: 'https://moonrepo.dev/schemas/v2/workspace.json'

projects:
  # Tooling. Runs outside both planes; may import shared only.
  scripts: 'scripts'
  pi: '.pi'

  # Applications.
  #
  # One application, not two. `api: 'apps/backend/api'` was removed with the
  # application it pointed at: a separate Elysia Worker that the browser reached
  # through a Vite proxy. The browser half and the Worker half are now the same
  # SvelteKit project, so there is one project here and its two runtimes are a
  # property of the source layout, not of the build graph.
  client: 'apps/frontend/client'
  # Root :test includes the native Bun tests in src/ and scripts/; :lint and
  # :format cover src/, and :typecheck runs svelte-check. This project defines no
  # Cargo tasks: Rust formatting, clippy and tests run in the native CI workflow.
  native: 'apps/frontend/native'
  e2e: 'apps/e2e'

  # Shared packages: portable, no project dependencies at all.
  schemas: 'packages/shared/schemas'
  logger: 'packages/shared/logger'
  utils: 'packages/shared/utils'
  fixtures: 'packages/shared/fixtures'
  # What this project sells. Portable because two planes must read it — the Worker
  # validating a checkout, and `bun run stripe:setup` declaring the catalogue — and
  # `MAY_REACH` forbids `node -> worker`, so a catalogue either side would be a
  # second copy. See packages/shared/billing/README.md.
  billing: 'packages/shared/billing'

  # Frontend packages: browser code. Shared only.
  #
  # `frontend-services` is gone. It held a three-deep base-class chain
  # (BaseFrontendClass -> BaseViewModel -> BaseFormViewModel) with three subclasses
  # in the whole repository and thirteen members that had no caller at all. The
  # parts that were load-bearing — StaleGuard, MutationGuard, OptimisticUpdate —
  # were already in `@starter/utils`, and the one component that needed to survive
  # moved into `@starter/ui` beside the components it renders.
  ui: 'packages/frontend/ui'
  # `platform` is the contracts a host implements; `features` is the notes and
  # account screens built on them. Both are browser-plane code that any host can
  # render — the SSR web application today, a static native bundle next. Neither
  # may import an application, a SvelteKit router or a Tauri bridge; `bun run
  # guard` refuses each of those edges, which is what keeps one copy of a screen
  # honest for two hosts.
  platform: 'packages/frontend/platform'
  features: 'packages/frontend/features'

  # Backend packages: server code. Shared only.
  database: 'packages/backend/database'
  auth: 'packages/backend/auth'
  # Job state, admission, attempt fencing, the Workflow dispatch port and bounded
  # maintenance. A backend package rather than a folder inside the web app, because
  # PR H's jobs Worker has to run the maintenance sweep without importing the web
  # application — and the web app is the only thing that would drag SvelteKit in.
  jobs: 'packages/backend/jobs'
  # Stripe checkout, portal and webhook verification. Worker-plane because it runs
  # inside the Worker's request lifecycle and reaches Stripe over HTTPS; its prices
  # come from the portable `@starter/billing` catalogue, which is what keeps the
  # amount in one place across the Worker and `bun run stripe:setup`.
  billing-server: 'packages/backend/billing'

  # Compute, in two projects that share a directory:
  #
  #   `jobs-worker` the TypeScript Worker that owns the Workflows, the container
  #              Durable Object and the scheduled maintenance. It is worker-plane code,
  #              so its tasks are named `test`/`lint`/`typecheck` and join the root
  #              selectors — and its *compute* lane is named `test-compute`, because
  #              that one needs a Docker engine. See apps/backend/jobs/moon.yml.
  #   `media`  the Rust/FFmpeg processor that runs inside the container. Its tasks
  #            are named `cargo-*` on purpose — see apps/backend/media/moon.yml for
  #            why they do not join the `:test`/`:lint` selectors the web lanes run
  #            without a Rust toolchain.
  #
  # Two distinct ids for two projects that share a directory name. Moon ids come
  # from these keys, and `jobs` is already the id of the shared job *domain* package
  # above — two keys with one name is one of them silently unreachable by selector.
  jobs-worker: 'apps/backend/jobs'
  media: 'apps/backend/media'

vcs:
  # `manager` was renamed to `client` in Moon 2.x.
  client: 'git'
  # Setup installs the committed hook with a worktree-specific relative
  # `core.hooksPath`. Moon hook sync is disabled because its generated script would
  # replace the repo-managed, portable hook.
  sync: false
  # `origin/main`, not `main`. A pull-request checkout is a detached HEAD: it has
  # no local `main`, so every job died with
  #   fatal: ambiguous argument 'main': unknown revision or path not in the working tree
  # before running a single test. The remote-tracking ref is the one ref
  # `actions/checkout` always creates, and `git rev-parse origin/main` resolves in
  # both a push and a pull-request checkout.
  #
  # `fetch-depth: 0` in ci.yml is still required — without it the merge base does
  # not exist either — but on its own it is not sufficient, because a full clone
  # still has `main` only as a remote ref. Both halves are needed; each was found
  # by reproducing the failure locally rather than by reading the error once.
  defaultBranch: 'origin/main'

# ── What Moon's cache can and cannot see here ──────────────────────────────────
#
# The cache gate supplements the inputs declared by this workspace's tasks.
# Moon 2.6.0 supports workspace-root-relative inputs; the observations below
# describe the measured task configuration, not a limit on all Moon tasks.
#
# 1. Parent traversal such as '../../biome.json' is rejected at parse time:
#
#      tasks.probe.inputs[0]: parent directory traversal (..) is not supported
#
#    This does not prevent workspace-root-relative inputs such as '/biome.json'
#    or '/bun.lock'. Root package.json, bunfig.toml, biome.json,
#    config/toolchain.json and config/tsconfig/*.json can also be declared that
#    way. The gate fingerprints these shared files because the current task
#    inputs do not consistently cover them.
#
# 2. The 2026-10-05 two-project measurement on 2.6.0 used liba:test with no
#    declared outputs (outputs: []) and libb:test with deps: ['liba:test'].
#    With no explicit cacheStrategy, this edge effectively uses 'ignored'
#    because liba:test has no outputs. Editing liba/src/index.ts re-ran
#    liba:test under a new hash (00b5db61), while libb:test still reported
#    'cached, cd620ceb'. Editing libb's own source moved its hash (f79a698f).
#    The cache hit shows that dependency hashes do not invalidate libb:test
#    with these settings. An edge using cacheStrategy: hash includes the
#    dependency hash; a dependency with outputs defaults to that strategy.
#    cacheStrategy: outputs instead tracks changes to dependency outputs.
#
# Rechecked on 2026-10-06 with Moon 2.6.0: `moon task libb:test --json`
# reports the edge as 'ignored' for outputs: [], and '/root.txt' appears in
# inputFiles. Editing the dependency leaves libb:test cached; editing the
# declared root input changes its hash.
#
# `bun run scripts/src/cli.ts cached -- <targets>` selects Moon's --cache mode
# from a fingerprint over the shared files in (1) and the package sources listed
# in scripts/src/ci/cache_scope.ts. Unchanged inputs permit read-write; changed
# or unreadable inputs select off. This is a conservative gate for the current
# declarations. scripts/tests/cache_scope.test.ts covers its transitions.
