$schema: 'https://moonrepo.dev/schemas/v2/project.json'
layer: 'library'

fileGroups:
  sources:
    - 'src/**/*'
    - 'tools/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
  tests:
    - 'src/**/*.test.ts'
    - 'tests/**/*'

toolchains:
  bun:
  javascript:

dependsOn:
  - schemas

tasks:
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs: ['@group(sources)', '@group(configs)']
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs: ['@group(sources)', '@group(configs)']
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs: ['@group(sources)', '@group(configs)']
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs: ['@group(sources)', '@group(configs)']
  test:
    command: 'bun'
    args: ['run', 'test']
    inputs: ['@group(sources)', '@group(configs)', '@group(tests)']
  db-types:
    command: 'bun'
    args: ['run', 'db:types']
    inputs: ['@group(sources)', '@group(configs)']
    options:
      cache: false
  validate:
    deps: ['~:lint', '~:format', '~:typecheck']
