$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# Tasks are delegations to this project's own package.json script. The one task
# that is not a bare delegation is `db-generate`, which was
# `echo "nothing to build (TypeScript source)"`: `bun run db:generate` therefore
# printed a message instead of generating a migration. A schema change with no
# generated migration fails at deploy time against a real D1 database.
layer: 'library'

fileGroups:
  sources:
    - 'src/**/*'
    - 'drizzle.config.ts'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
  migrations:
    - 'drizzle-d1/**/*.sql'
    - 'drizzle-d1/meta/*.json'

toolchains:
  bun:
  javascript:

dependsOn:
  - schemas

tasks:
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
  test:
    command: 'bun'
    args: ['run', 'test']
    inputs:
      - '@group(sources)'
      - '@group(configs)'

  # This project ships source, not a build artifact, so there is nothing to emit.
  build:
    command: 'echo'
    args: ['nothing to build (TypeScript source; the deployable output is the D1 migration set)']

  # Reads the schema, writes `drizzle-d1/`. Never cached: the output is a new set
  # of SQL files, and a restored "result" would be migrations on disk that this run
  # did not generate — which is worse than no migrations at all.
  db-generate:
    command: 'bun'
    args: ['run', 'db:generate']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    outputs:
      - '@group(migrations)'
    options:
      cache: false

  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'