$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# Written out rather than extended from a shared template, matching every other
# first-party library. Each task delegates to this project's own package.json
# script, which stays the authority for what the script does. See
# .moon/workspace.yml.
#
# No `dependsOn`: this package has no workspace dependencies at all, and that is
# the property the dependency rules in the guards exist to protect. A future
# import of `@starter/utils` here has to be a decision, not a slip.
layer: 'library'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig*.json'
    - 'moon.yml'
  tests:
    - 'src/**/*.test.ts'
    - 'src/**/*.spec.ts'
    - 'tests/**/*'

toolchains:
  bun:
  javascript:

tasks:
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
  lint:
    command: 'bun'
    args: ['run', 'lint']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
  format:
    command: 'bun'
    args: ['run', 'format']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
  fix:
    command: 'bun'
    args: ['run', 'fix']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
  test:
    command: 'bun'
    args: ['run', 'test']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
  validate:
    deps:
      - '~:lint'
      - '~:format'
      - '~:typecheck'